# Cross-platform checks on every push / PR (no release artifacts).
name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libglib2.0-dev \
            libgdk-pixbuf2.0-dev libpango1.0-dev libatk1.0-dev libcairo2-dev \
            libwebkit2gtk-4.1-dev patchelf pkg-config

      - run: npm ci
      - run: npm run build

      - name: Rust tests
        run: cd src-tauri && cargo test --verbose

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm run build

      - name: Rust check (Windows target)
        run: cd src-tauri && cargo check --verbose
