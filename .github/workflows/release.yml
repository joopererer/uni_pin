# Build signed/unsigned installers and attach to a GitHub Release.
# Triggers: git tag push `v*` (e.g. v0.2.2) or manual “Run workflow” (must enter existing tag).
name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing git tag to build (e.g. v0.2.2). Create the tag locally first, then push it — or use a tag you already pushed.'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.release_tag) || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm run build

      - name: Tauri build & attach Windows artifacts to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'UniPin v__VERSION__'
          releaseBody: |
            ## UniPin ${{ env.RELEASE_TAG }}

            | Platform | Artifacts |
            |----------|-----------|
            | Windows | NSIS `.exe` (and `.msi` if enabled) |
            | Ubuntu 22.04 | `.deb` / `.AppImage` with suffix **`.ubuntu22.04`** |
            | Ubuntu 24.04 | `.deb` / `.AppImage` with suffix **`.ubuntu24.04`** |

            Choose the Linux package that matches your Ubuntu LTS. In-app updates pick the right asset via `/etc/os-release`.
          releaseDraft: true
          prerelease: false

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            distro_tag: ubuntu22.04
          - os: ubuntu-24.04
            distro_tag: ubuntu24.04
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.release_tag) || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libgdk-pixbuf2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config

      - run: npm run build

      - name: Build Tauri bundles
        run: npm exec -- tauri build

      - name: Add distro suffix (22.04 vs 24.04)
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ matrix.distro_tag }}"
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/deb/*.deb; do
            base="${f%.deb}"
            mv "$f" "${base}.${tag}.deb"
          done
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            base="${f%.AppImage}"
            mv "$f" "${base}.${tag}.AppImage"
          done

      - name: Upload Linux bundles
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
