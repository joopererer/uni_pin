[package]
name = "uni-pin"
version = "0.2.0"
description = "UniPin - A Tauri-based sticky notes application"
authors = ["you"]
edition = "2021"

[lib]
name = "uni_pin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
image = "0.24"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
base64 = "0.21"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
windows = { version = "0.54", features = [
    "Win32_System_DataExchange",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Memory",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tokio-test = "0.4"
